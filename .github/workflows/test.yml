name: test

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: techspeak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/techspeak_test
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      PORT: 3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run migrate --workspace=packages/backend

      - run: npm test --workspaces --if-present

      - name: Backend test coverage
        run: |
          npm run test:coverage --workspace=packages/backend 2>&1 | tee backend-coverage.txt
          {
            echo '## Backend test coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' backend-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: backend smoke test
        run: |
          node packages/backend/src/index.js &
          SERVER_PID=$!
          bash packages/backend/tests/smoke.sh
          kill "$SERVER_PID"
